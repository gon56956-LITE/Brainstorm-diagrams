<g id="exclusion-how-to-use">
<rect x="1270" y="878" width="620" height="286" rx="12" fill="#FFFFFF" stroke="#6E93BD" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="1294" y="920" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#0B2E63">How to Use</text>
<rect x="1294" y="936" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="956" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
<rect x="1332" y="930" width="532" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="1352" y="958" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">Start from the top event and run each check in order.</text>
<rect x="1294" y="984" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="1004" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
<rect x="1332" y="978" width="532" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="1352" y="1006" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">Follow the Yes/No result downward along the arrows.</text>
<rect x="1294" y="1032" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="1052" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<rect x="1332" y="1026" width="532" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="1352" y="1054" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">When a check fails, treat the side card as the priority cause to verify.</text>
<rect x="1294" y="1080" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="1100" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
<rect x="1332" y="1074" width="532" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="1352" y="1102" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">If all checks pass, investigate other paths or deeper causes.</text>
</g>
