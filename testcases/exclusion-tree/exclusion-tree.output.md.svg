<text x="1352" y="822" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">Start from the top event and run each check in order.</text>
<rect x="1294" y="848" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="868" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
