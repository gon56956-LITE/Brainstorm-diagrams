<text x="1352" y="870" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">Follow the Yes/No result downward along the arrows.</text>
<rect x="1294" y="896" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="916" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<rect x="1332" y="890" width="532" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<text x="1352" y="918" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" fill="#5B677A">When a check fails, treat the side card as the priority cause to verify.</text>
<rect x="1294" y="944" width="28" height="28" rx="4" fill="#0B2E63"/>
<text x="1308" y="964" text-anchor="middle" font-family="Arial, Helvetica, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
<rect x="1332" y="938" width="532" height="46" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
